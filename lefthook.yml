min_version: 1.6.0

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{js,ts,tsx,mjs}"
      run: npx eslint {staged_files}
    typecheck:
      run: npm run typecheck
    related-tests:
      glob: "*.{js,ts,tsx,mjs}"
      run: node .cursor/hooks/staged-related-tests.mjs {staged_files}

pre-push:
  parallel: false
  commands:
    test:
      run: npm test
    build:
      run: npm run build
